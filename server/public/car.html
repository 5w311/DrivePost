<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveTest</title>
<link rel="icon" href="/static/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="car">
  <header class="topbar">
    <div class="brand">Drive<span>Test</span></div>
    <form id="searchForm" class="search" autocomplete="off">
      <input id="q" type="search" placeholder="Search or paste a link" enterkeyhint="search">
      <button type="submit" class="primary search-btn" aria-label="Search">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15.2 15.2 20 20"/></svg></span>
        <span class="label">Search</span>
      </button>
    </form>
    <div class="top-actions">
      <select id="quality" aria-label="Quality">
        <option value="360">360p</option>
        <option value="480">480p</option>
        <option value="720">720p</option>
        <option value="1080">1080p</option>
      </select>
      <button id="phoneBtn" type="button">Phone</button>
      <button id="theaterBtn" type="button" aria-pressed="false">Theater</button>
      <button id="feedbackBtn" type="button">Feedback?</button>
      <span id="conn" class="dot" title="Connection"></span>
    </div>
  </header>

  <main class="layout">
    <section class="stage-col">
      <div id="stage" class="stage">
        <div id="canvasHost" class="canvas-host"></div>
        <div id="stageMsg" class="stage-msg"></div>
        <div id="stats" class="stats hidden"></div>
        <div id="overlay" class="overlay">
          <div class="overlay-top"><div id="fsTitle" class="overlay-title"></div></div>
          <div class="overlay-center">
            <button class="ctl" id="back10" aria-label="Back 10 seconds"></button>
            <button class="ctl main" id="playPause" aria-label="Play or pause"></button>
            <button class="ctl" id="fwd10" aria-label="Forward 10 seconds"></button>
            <button class="ctl" id="nextBtn" aria-label="Next video"></button>
          </div>
          <div class="scrub-row">
            <span id="tCur">0:00</span>
            <div id="scrub" class="scrub">
              <div class="scrub-track">
                <div id="scrubBuf" class="scrub-buf"></div>
                <div id="scrubFill" class="scrub-fill"></div>
                <div id="scrubKnob" class="scrub-knob"></div>
              </div>
            </div>
            <span id="tDur">0:00</span>
            <button class="ctl small text" id="fillToggle">Fill</button>
            <button class="ctl small" id="fsToggle" aria-label="Fullscreen"></button>
          </div>
        </div>
        <div id="pausedTag" class="paused-tag hidden">Paused</div>
        <div id="tapStart" class="tap-start hidden"><button id="tapStartBtn" class="primary">Tap to play</button></div>
      </div>
      <div class="now-meta">
        <div class="now-text">
          <div id="nowTitle" class="now-title"></div>
          <div id="nowSub" class="now-sub"></div>
        </div>
        <button id="statsBtn" class="ghost" type="button" aria-pressed="false">Stats</button>
      </div>
      <div class="passenger-note">For passengers while the car is moving.</div>
    </section>

    <aside class="side">
      <nav class="tabs">
        <button data-tab="queue" class="on">Up Next <span id="qCount" class="muted"></span></button>
        <button data-tab="search">Search</button>
        <button data-tab="recent">Recent</button>
      </nav>
      <div id="panel-queue" class="panel"></div>
      <div id="panel-search" class="panel hidden"></div>
      <div id="panel-recent" class="panel hidden"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/jsmpeg.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/drive-player.js"></script>
  <script src="/static/car.js"></script>
</body>
</html>
