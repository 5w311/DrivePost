services:
  drivepost:
    build: ./server
    container_name: drivepost
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      # This volume was named while the app was still called DriveTest. It
      # holds your sign-ins, profiles and history, so it keeps its name: under
      # a new name the app would start with empty data.
      - drivetest-data:/data
    # The app also answers to its old name inside Docker, so a tunnel route
    # that still says http://drivetest:8080 keeps working.
    networks:
      default:
        aliases:
          - drivetest

  # Optional: publish the app on your domain through a Cloudflare Tunnel.
  # Start with: docker compose --profile tunnel up -d
  # In the tunnel's route, point your subdomain at http://drivepost:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - drivepost

volumes:
  drivetest-data:
